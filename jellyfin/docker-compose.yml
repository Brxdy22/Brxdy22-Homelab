version: "2"
services: 
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000
    group_add:
      - '109'  # This needs to be the group id of running `stat -c '%g' /dev/dri/renderD128` on the docker host
    environment:
      - TZ=America/Chicago
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    volumes:
      - /home/ubuntu/docker/jellyfin/config:/config
      - /home/ubuntu/docker/jellyfin/cache:/cache
      - /home/ubuntu/docker/arr-stack/downloads/movies:/movies:ro
      - /home/ubuntu/docker/arr-stack/downloads/tvseries:/tvseries:ro
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    restart: unless-stopped
    security_opt:
          - no-new-privileges:true
    networks:
      proxy:

networks:
  proxy:
     external: true